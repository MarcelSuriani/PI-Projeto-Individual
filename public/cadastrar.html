<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style-cadastrar.css">
    <link rel="icon" href="assets/img/fav-icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <a href="/index.html">
      <img class="logoNav" src="assets/img/fav-icon.png" alt="Logo site">
    </a>
        <nav>
            <ul>
                <li><a href="/lore.html">LORE</a></li>
                <li><a href="/habilidades.html">HABILIDADES E SKINS</a></li>
                <li><a href="/quiz.html">QUIZ</a></li>
                <li><a href="/dashboard.html">DASHBOARD</a></li>
                <li class="icons active" id="btnEntrar"><a href="/login.html"><img src="/assets/icons/enter.png" alt="login"></a>
                </li>
                <li class="icons active" id="btnSair" style="display:none"><a onclick="sair()"><img src="/assets/icons/logout.png" alt="logout"></a></li>
            </ul>
        </nav>
    </header>
    <div class="container-3">
        <div class="cadastro-card">
            <div class="cadastro-logo">
                <img src="/assets/img/logo-Shaco-completo.png" alt="">
            </div>
            <div class="cadastro-linha">
                <div class="campo">
                    <label for="">Nome:</label>
                    <input type="text" id="iptNomeCompleto" placeholder="Nome completo">
                </div>
                <div class="campo">
                    <label for="">Nome de Usuario:</label>
                    <input type="text" id="iptNomeDeUsuario" placeholder="Nome de usuário">
                </div>
            </div>
            <div class="cadastro-linha">
                <div class="campo">
                    <label for="">Senha:</label>
                    <input type="password" id="iptSenha" placeholder="Senha">
                </div>
                <div class="campo">
                    <label for="">Confirme a senha:</label>
                    <input type="password" id="iptConfirmarSenha" placeholder="Confirme a senha">
                </div>
            </div>
            <div class="cadastro-linha">
                <div class="campo">
                    <label for="">Email:</label>
                    <input type="text" id="iptEmail" placeholder="seu@email.com">
                </div>
                <div class="campo">
                    <label for="">Telefone:</label>
                    <input type="text" id="iptTelefone" placeholder="Número de celular">
                </div>
            </div>
            <div class=".cadastro-card">

                <button onclick="cadastrar()">CADASTRAR</button>
            </div>

            <span>
                Já possui uma conta?
                <a href="login.html">Clique aqui para se conectar</a>
            </span>
            <div class="cadastro-mensagem" id="divMensagem"></div>
        </div>
    </div>

    <footer>
        <div>
            <img class="logoM" src="/assets/img/logo-Marcel.png" alt="">
        </div>
        <p>© 2026. Todos os direitos reservados.</p>
    </footer>



</body>

</html>

<script>
    let caracteresEspeciais = ['!', '@', '#', '$', '%', '^', '&', '*', '(', ')', '-', '_', '=', '+', '[', ']', '{', '}', ';', ':', "'", '"', '\\', '|', ',', '.', '<', '>', '/', '?', '`', '~'];

    let idUsuario = sessionStorage.getItem("ID_USUARIO");

        if (idUsuario) {
            document.getElementById("btnEntrar").style.display = "none";
            document.getElementById("btnSair").style.display = "block";
        }

        function sair() {
            sessionStorage.clear();
            alert("logout feito com sucesso")
            window.location = "/index.html";
        }

    function cadastrar() {
        let nome = iptNomeCompleto.value;
        let email = iptEmail.value;
        let username = iptNomeDeUsuario.value
        let senha = iptSenha.value;
        let confirmarSenha = iptConfirmarSenha.value;
        let telefone = iptTelefone.value;

        let incluiCaracterEspecial = false;
        let incluiArroba = email.includes('@');
        // let incluiDotCom = email.endsWith('.com'); O USUARIO PODE TER UM EMAIL TIPO SPTECH


        divMensagem.innerHTML = "";

        for (let i = 0; i < caracteresEspeciais.length - 1; i++) {
            if (senha.includes(caracteresEspeciais[i])) {
                incluiCaracterEspecial = true;
                break;
            }
        }

        if (
            nome == "" || email == "" || username == "" || senha == "" ||
            confirmarSenha == "" || telefone == "") {
            divMensagem.innerHTML = "Preencha todos os campos.";
            setTimeout(function() {
    divMensagem.innerHTML = "";
}, 3000);
            return

        } else if (incluiArroba == false /*|| incluiDotCom == false*/) {
            divMensagem.innerHTML = "Email inválido!";
            setTimeout(function() {
    divMensagem.innerHTML = "";
}, 3000);
            return

        } else if (!(senha.length > 7)) {
            divMensagem.innerHTML = "A senha deve conter pelo menos 8 caracteres!";
            setTimeout(function() {
            divMensagem.innerHTML = "";
            }, 3000);
            return

        } else if (!incluiCaracterEspecial) {
            divMensagem.innerHTML += `A senha precisa ter caractere especial<br> `;
            setTimeout(function() {
            divMensagem.innerHTML = "";
            }, 3000);
            return
        } else if (!(senha == confirmarSenha)) {
            divMensagem.innerHTML = "As senhas não coincidem!";
            setTimeout(function() {
            divMensagem.innerHTML = "";
            }, 3000);
            return

        } else {
        }

        // web-data-viz

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nome,
                emailServer: email,
                senhaServer: senha,
                usernameServer: username,
                telefoneServer: telefone,
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    alert("Cadastro realizado com sucesso! Redirecionando para tela de Login");

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "1500");

                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                alert("Erro ao efetuar o cadastro")
            });
    }
</script>
