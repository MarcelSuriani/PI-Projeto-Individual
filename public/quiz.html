<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>

  <link rel="stylesheet" href="style-quiz.css">
  <link rel="icon" href="assets/img/fav-icon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

</head>

<body onload="onloadEsconder()">
  <header>
    <a href="/index.html">
      <img class="logoNav" src="assets/img/fav-icon.png" alt="Logo site">
    </a>
    <nav>
      <ul>
        <li><a href="/lore.html">LORE</a></li>
        <li><a href="/habilidades.html">HABILIDADES E SKINS</a></li>
        <li><a href="/guia.html">GUIA DO CLONE</a></li>
        <li class="active"><a href="/quiz.html">QUIZ</a></li>
        <li><a href="/dashboard.html">DASHBOARD</a></li>
        <li class="icons"><a href="/login.html"> <img src="/assets/icons/enter.png" alt=""></a>
        </li>
      </ul>
    </nav>
  </header>

  <div class="container-8">
    <div class="hero">
      <video autoplay muted loop playsinline>
        <source class="mp4" src="/assets/img/bg/BG-QUIZ.mp4" type="video/mp4">
      </video>
    </div>
  </div>
  <div class="quiz-titulo">QUIZ DO CLONE</div>

    <div id="pontuacaoEJogo">
      <button class="btn" id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>
    

      <div id="pontuacao" class="quiz-pontuacao">
        <div id="pontuacaoDuranteJogo" class="quiz-pontuacao">
          <span>Acertos: <span id="spanCertas"></span></span>
          <span>Erros: <span id="spanErradas"></span></span>
        </div>
        <div id="pontuacaoFinalJogo">
          <span id="pontuacaoFinal">
            Pontuação Final:
            <span id="spanPontuacaoFinal"></span>
          </span>
          <span id="msgFinal"></span>
        </div>
      </div>
    
      

        <div id="jogo" class="quiz-questao">
          <div id="infoQuestao" class="quiz-numero">
            <span>Questão <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
          </span>
        </div>
        
        <div id="perguntaDaQuestaoAtual">
          <span id="spanQuestaoExibida"></span>
        </div>
    
        <div id="infoAlternativas">
        </div>
    
        <div id="opcoes" class="quiz-opcoes">
          <span>
            <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA" />
            <label for="primeiraOpcao" id="labelOpcaoUm"></label>
          </span>
          <span>
            <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB" />
            <label for="segundaOpcao" id="labelOpcaoDois"></label>
          </span>
          <span>
            <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC" />
            <label for="terceiraOpcao" id="labelOpcaoTres"></label>
          </span>
          <span>
            <input type="radio" id="quartaOpcao" name="option" value="alternativaD" />
            <label for="quartaOpcao" id="labelOpcaoQuatro"></label>
          </span>
        </div>
    
        <div id="botoes">
          <button onclick="submeter()" id="btnSubmeter">Submeter resposta</button>
          <button onclick="avancar()" id="btnProx" disabled>Avançar para próxima questão</button>
          <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
          <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>Tentar novamente</button>
        </div>
      </div>
    
    </div>

    <footer>
      <div>
        <img class="logoM" src="/assets/img/logo-Marcel.png" alt="">
      </div>
      <p>© 2026. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
<script>
  const listaDeQuestoes = [
    {
      pergunta: "O que Shaco era antes de ser corrompido pelo caos?",
      alternativaA: "Um assassino contratado",
      alternativaB: "Um brinquedo de um príncipe solitário",
      alternativaC: "Um espírito antigo sem forma",
      alternativaD: "Um soldado do exército real",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "Shaco mata por ódio e busca vingança contra quem destruiu sua vida.",
      alternativaA: "Verdadeiro",
      alternativaB: "Falso",
      alternativaC: "",
      alternativaD: "",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "Qual é o efeito da passiva do Shaco, Apunhalar?",
      alternativaA: "Causa dano mágico ao atacar pela frente",
      alternativaB: "Causa dano adicional ao atingir o inimigo por trás",
      alternativaC: "Reduz a velocidade do inimigo ao atacar",
      alternativaD: "Gera escudo ao causar dano crítico",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "O que acontece quando o clone do Shaco (R) morre?",
      alternativaA: "Ele explode e cura o Shaco",
      alternativaB: "Ele some sem causar nenhum efeito",
      alternativaC: "Ele explode, surgem três Jack in the Box e causa dano aos inimigos próximos",
      alternativaD: "Ele se transforma no Shaco real",
      alternativaCorreta: "alternativaC"
    },
    {
      pergunta: "O Q do Shaco causa dano crítico ao atacar pelas costas enquanto invisível.",
      alternativaA: "Verdadeiro",
      alternativaB: "Falso",
      alternativaC: "",
      alternativaD: "",
      alternativaCorreta: "alternativaA"
    },
    {
      pergunta: "Qual habilidade do Shaco causa medo nos inimigos?",
      alternativaA: "Q — Enganar",
      alternativaB: "W — Jack in the Box",
      alternativaC: "E — Veneno de Dois Gumes",
      alternativaD: "R — Alucinações",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "Qual skin do Shaco é inspirada em Alice no País das Maravilhas?",
      alternativaA: "Asylum Shaco",
      alternativaB: "Shacoringa",
      alternativaC: "Shaco Chapeleiro Maluco",
      alternativaD: "Goseong",
      alternativaCorreta: "alternativaC"
    },
    {
      pergunta: "O caos que habita Shaco criou uma consciência humana com emoções e empatia.",
      alternativaA: "Verdadeiro",
      alternativaB: "Falso",
      alternativaC: "",
      alternativaD: "",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "Segundo a lore, como Shaco foi criado?",
      alternativaA: "Ele estava em um campo de batalha destruído",
      alternativaB: "Foi criado como brinquedo para um príncipe e corrompido pela magia negra",
      alternativaC: "Surgiu de um ritual de invocação",
      alternativaD: "Escapou de uma prisão dimensional",
      alternativaCorreta: "alternativaB"
    },
    {
      pergunta: "Qual habilidade envenena os inimigos passivamente e causa dano extra abaixo de 30% de vida?",
      alternativaA: "Q — Enganar",
      alternativaB: "W — Jack in the Box",
      alternativaC: "E — Veneno de Dois Gumes",
      alternativaD: "R — Alucinações",
      alternativaCorreta: "alternativaC"
    },
    {
      pergunta: "Qual detalhe oculto conecta Shaco diretamente ao conceito de caos?",
      alternativaA: "O sorriso do boneco",
      alternativaB: "O desaparecimento do príncipe",
      alternativaC: "O nome ser um anagrama de 'Chaos'",
      alternativaD: "As adagas envenenadas",
      alternativaCorreta: "alternativaC"
    },
    {
      pergunta: "O que é o que é? Um palhaço sorridente, vestido de amarelo e vermelho.",
      alternativaA: "Uma péssima decisão de moda 👎",
      alternativaB: "Ketchup e mostarda após ganhar consciência 🍅",
      alternativaC: "O mascote de uma rede de fast-food 🍔",
      alternativaD: "Shaco McDonald's 👍",
      alternativaCorreta: "alternativaD"
    }
  ]
  // variáveis globais    
  let numeroDaQuestaoAtual = 0
  let pontuacaoFinal = 0
  let tentativaIncorreta = 0
  let certas = 0
  let erradas = 0
  let quantidadeDeQuestoes = listaDeQuestoes.length
  // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

  function onloadEsconder() {
    document.getElementById('pontuacao').style.display = "none"
    document.getElementById('jogo').style.display = "none"
  }

  function iniciarQuiz() {
    let idUsuario = sessionStorage.ID_USUARIO;

    if (!idUsuario) {
        alert("Você precisa estar logado para enviar suas preferências.");
        window.location = "login.html";
        return;
    }

    document.getElementById('pontuacao').style.display = "flex"
    document.getElementById('jogo').style.display = "flex"
    document.getElementById('btnIniciarQuiz').style.display = "none"

    document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes

    preencherHTMLcomQuestaoAtual(0)

    btnSubmeter.disabled = false
    btnProx.disabled = true
    // btnConcluir.disabled = true
    btnTentarNovamente.disabled = true
  }

  function preencherHTMLcomQuestaoAtual(index) {
    habilitarAlternativas(true)
    const questaoAtual = listaDeQuestoes[index]
    numeroDaQuestaoAtual = index
    console.log("questaoAtual")
    console.log(questaoAtual)
    document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
    document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
    document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
    document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
    document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
    document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;

    // pega o elemento pai com o parentElement e verifica com operador ternário(que é uma forma curta de escrever if/else) se tem ou não texto. Ai direciona pro block ou none a depender do caso
    document.getElementById("labelOpcaoTres").parentElement.style.display = questaoAtual.alternativaC ? "block" : "none"
    document.getElementById("labelOpcaoQuatro").parentElement.style.display = questaoAtual.alternativaD ? "block" : "none"
  }

  function submeter() {
    const options = document.getElementsByName("option"); // recupera alternativas no html

    let hasChecked = false
    for (let i = 0; i < options.length; i++) {
      if (options[i].checked) {
        hasChecked = true
        break
      }
    }

    if (!hasChecked) {
      alert("Não há alternativas escolhidas. Escolha uma opção.")
    } else {
      btnSubmeter.disabled = true
      btnProx.disabled = false

      habilitarAlternativas(false)

      checarResposta()
    }
  }

  function habilitarAlternativas(trueOrFalse) {
    let opcaoEscolhida = trueOrFalse ? false : true

    primeiraOpcao.disabled = opcaoEscolhida
    segundaOpcao.disabled = opcaoEscolhida
    terceiraOpcao.disabled = opcaoEscolhida
    quartaOpcao.disabled = opcaoEscolhida

  }

  function avancar() {
    btnProx.disabled = true
    btnSubmeter.disabled = false

    desmarcarRadioButtons()

    if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
    } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
      alert("Atenção... a próxima é a ultima questão!")
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
    } else {
      finalizarJogo()
    }
    limparCoresBackgroundOpcoes()
  }

  function tentarNovamente() {
    // atualiza a página
    window.location.reload()
  }

  function checarResposta() {
    const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
    const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual

    const options = document.getElementsByName("option"); // recupera alternativas no html

    let alternativaCorreta = null // variável para armazenar a alternativa correta

    options.forEach((option) => {
      if (option.value === respostaQuestaoAtual) {
        console.log("alternativaCorreta está no componente: " + alternativaCorreta)
        alternativaCorreta = option.labels[0].id
      }
    })

    // verifica se resposta assinalada é correta
    options.forEach((option) => {
      if (option.checked === true && option.value === respostaQuestaoAtual) {
        document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
        pontuacaoFinal++
        certas++
        document.getElementById("spanCertas").innerHTML = certas
        numeroDaQuestaoAtual++
      } else if (option.checked && option.value !== respostaQuestaoAtual) {
        const wrongLabelId = option.labels[0].id

        document.getElementById(wrongLabelId).classList.add("text-danger-with-bg")
        document.getElementById(alternativaCorreta).classList.add("text-success-with-bg")
        tentativaIncorreta++
        erradas++
        document.getElementById("spanErradas").innerHTML = erradas
        numeroDaQuestaoAtual++
      }
    })
  }

  function limparCoresBackgroundOpcoes() {
    const options = document.getElementsByName("option");
    options.forEach((option) => {
      document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
      document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
    })
  }

  function desmarcarRadioButtons() {
    const options = document.getElementsByName("option");
    for (let i = 0; i < options.length; i++) {
      options[i].checked = false;
    }
  }

  function finalizarJogo() {
    let textoParaMensagemFinal = null
    let classComCoresParaMensagemFinal = null
    const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes

    if (porcentagemFinalDeAcertos <= 0.25) {
      textoParaMensagemFinal = "<br>🤡 Vítima da Pegadinha<br>Eu até diria que você foi bem mas ai estariamos os dois errados"
      classComCoresParaMensagemFinal = "text-danger-with-bg"
    } else if (porcentagemFinalDeAcertos <= 0.4) {
      textoParaMensagemFinal = "<br>🎭 Clone Suspeito<br>Por um momento achei que você sabia. Foi uma ilusão."
      classComCoresParaMensagemFinal = "text-warning-with-bg"
    } else if (porcentagemFinalDeAcertos <= 0.6) {
      textoParaMensagemFinal = "<br>🎪 Aprendiz do Caos <br> Nem tudo que brilha é ouro. Nem toda resposta marcada estava certa."
      classComCoresParaMensagemFinal = "text-warning-with-bg"
    } else if (porcentagemFinalDeAcertos <= 0.8) {
      textoParaMensagemFinal = "<br>🗡️ Mestre das Ilusões <br> Poucos chegam tão longe sem explodir uma caixa surpresa."
      classComCoresParaMensagemFinal = "text-warning-with-bg"
    } else if (porcentagemFinalDeAcertos <= 0.9) {
      textoParaMensagemFinal = "<br>🎭 Caçador de clones <br> Nem os clones conseguiram te enganar. "
      classComCoresParaMensagemFinal = "text-warning-with-bg"
    } else {
      textoParaMensagemFinal = "<br>👁️ Imune a ilusões <br> Resultado perfeito. Suspeitamente perfeito...Os clones estão pedindo revisão do resultado "
      classComCoresParaMensagemFinal = "text-warning-with-bg"
    }
    textoParaMensagemFinal += "<br> Você acertou " + Math.round((porcentagemFinalDeAcertos) * 100) + "% das questões."


    document.getElementById('msgFinal').innerHTML = textoParaMensagemFinal
    document.getElementById('msgFinal').classList.add(classComCoresParaMensagemFinal)
    document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal

    document.getElementById('jogo').classList.add("text-new-gray")

    btnProx.disabled = true
    btnSubmeter.disabled = true
    // btnConcluir.disabled = true
    btnTentarNovamente.disabled = false
  }
</script>
