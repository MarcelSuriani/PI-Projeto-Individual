<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style-login.css">
    <link rel="icon" href="assets/img/fav-icon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <a href="/index.html">
      <img class="logoNav" src="assets/img/fav-icon.png" alt="Logo site">
    </a>
        <nav>
            <ul>
                <li><a href="/lore.html">LORE</a></li>
                <li><a href="/habilidades.html">HABILIDADES E SKINS</a></li>
                <li><a href="/quiz.html">QUIZ</a></li>
                <li><a href="/dashboard.html">DASHBOARD</a></li>
                <li class="icons active" id="btnEntrar"><a href="/login.html"><img src="/assets/icons/enter.png" alt="login"></a></li>
                <li class="icons" id="btnSair" style="display:none"><a onclick="sair()"><img src="/assets/icons/logout.png" alt="logout"></a></li>
            </ul>
        </nav>
    </header>

    <div class="container-2">
        <div class="login-card">
            <div class="login-logo">
                <img src="/assets/img/logo-Shaco-completo.png" alt="">
            </div>

            <label>Login</label>
            <input id="iptLogin" type="text" placeholder="Nome de Usuario">

            <label>Senha</label>
            <input id="iptSenha" type="password" placeholder="••••••••">

            <button onclick="entrar()">CONECTAR</button>

            <span>
                Não possui uma conta?
                <a href="cadastrar.html">Cadastre-se</a>
            </span>

            <div id="divMensagem"></div>

        </div>

        <div class="login-bg">
        </div>
    </div>

    <footer>
        <div>
            <img class="logoM" src="/assets/img/logo-Marcel.png" alt="">
        </div>
        <p>© 2026. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
<script>

    let idUsuario = sessionStorage.getItem("ID_USUARIO");

        if (idUsuario) {
            document.getElementById("btnEntrar").style.display = "none";
            document.getElementById("btnSair").style.display = "block";
        }

        function sair() {
            sessionStorage.clear();
            alert("logout feito com sucesso")
            window.location = "/index.html";
        }

    function entrar() {
        let login = iptLogin.value;
        let senha = iptSenha.value;

        if(login =="" || senha==""){
            alert("Os campos de login e/ou senha não foram preenchidos.")
            return
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usernameServer: login,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.setItem("ID_USUARIO", json.id);
                    sessionStorage.setItem("NOME_USUARIO", json.nome);
                    sessionStorage.setItem("USERNAME_USUARIO", json.username);

                    alert("Login realizado com sucesso. Redirecionando para landpage")
                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {
                alert("Houve um erro ao tentar realizar o login! \nVerifique login e/ou senha e tente novamente")
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            alert("Erro ao tentar conectar. Login e/ou senha inválidos!")
        })

    }
</script>
