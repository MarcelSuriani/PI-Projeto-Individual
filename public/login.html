<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
        Login:
        <input id="iptLogin" type="text" placeholder="Nome de usuário"> <br>
        
        Senha:
        <input id="iptSenha" type="password" placeholder="••••••••"> <br>
        
        <button onclick="entrar()">Entrar</button> <br>
        Não possui uma conta?<a href="cadastrar.html">Cadastre-se</a>
        <div id="divMensagem"></div>
</body>
</html>

<script>
    function entrar() {
        let login = iptLogin.value;
        let senha = iptSenha.value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usernameServer: login,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            alert("Erro ao tentar conectar. Login e/ou senha inválidos!")
        })

    }
</script>
